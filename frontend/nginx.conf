server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API is reached through this origin, so the browser never makes a
    # cross-origin call and CORS never enters the picture in the packaged stack.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Useful when checking the stack is up from the browser.
    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_set_header Host $host;
    }

    # Hashed filenames are immutable, so they can be cached hard. One directive, not
    # `expires` plus `add_header`, which would emit two Cache-Control headers.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page application: any unknown path is a client-side route, not a 404.
    # index.html itself must never be cached, or a deploy would go unnoticed.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
