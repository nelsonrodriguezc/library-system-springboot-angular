<!DOCTYPE html>
<!--
  Shared shell for every message. Table-based and with inline styles on purpose: mail
  clients still have no reliable support for flexbox, grid or external stylesheets.
  Each template calls this fragment and passes its own body.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:fragment="page(subject, preheader, body)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${subject}">Libris</title>
</head>
<body style="margin:0; padding:0; background-color:#f7f8fc;
             font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
             color:#1f2540; -webkit-font-smoothing:antialiased;">

<!-- Shown in the inbox preview line, never on screen. -->
<div style="display:none; max-height:0; overflow:hidden; opacity:0;" th:text="${preheader}"></div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color:#f7f8fc; padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width:560px; background-color:#ffffff; border:1px solid #e8eaf2;
                          border-radius:16px; overflow:hidden;">

                <tr>
                    <td style="background-color:#1e2a5a; padding:24px 32px;">
                        <span style="font-size:20px; font-weight:700; color:#ffffff; letter-spacing:-0.2px;">
                            Libris
                        </span>
                        <span style="display:block; font-size:12px; color:#a9b3d9; margin-top:2px;">
                            Sistema de préstamos de la biblioteca
                        </span>
                    </td>
                </tr>

                <tr>
                    <td style="padding:32px;">
                        <div th:replace="${body}">Contenido del mensaje</div>
                    </td>
                </tr>

                <tr>
                    <td style="background-color:#fafbff; border-top:1px solid #e8eaf2;
                               padding:20px 32px; font-size:12px; line-height:1.6; color:#6b7394;">
                        Este es un mensaje automático de Libris; no hace falta que respondas.
                        <br>
                        <a th:href="${appUrl}" th:text="${appUrl}"
                           style="color:#4f46e5; text-decoration:none;">http://localhost:4200</a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
