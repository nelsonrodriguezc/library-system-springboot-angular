spring:
  application:
    name: libris
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/libris}
    username: ${DB_USERNAME:libris}
    password: ${DB_PASSWORD:libris}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      # Loads the subjects of a whole page of books in one extra query instead of one per row.
      hibernate.default_batch_fetch_size: 32
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    # Nullable fields stay in the payload as explicit nulls. Dropping them would force
    # every client to tell "absent" from "null" when rendering, for example a loan that
    # has no return date yet.
    default-property-inclusion: always

server:
  port: 8080
  error:
    # Error bodies are produced by the RestControllerAdvice, never by the container.
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # The application is perfectly usable when the SMTP server is down: mail is sent
    # asynchronously and out of band. Tying readiness to it would take the API out of
    # rotation over a notification problem.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.libris: INFO

libris:
  security:
    jwt:
      # Empty on purpose: no secret is ever committed. See .env.example.
      secret: ${JWT_SECRET:}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:biblioteca@libris.local}
    app-base-url: ${APP_BASE_URL:http://localhost:4200}
    # Daily sweeps. Both jobs are idempotent, so re-running them is harmless.
    due-soon-cron: ${LIBRIS_DUE_SOON_CRON:0 0 8 * * *}
    overdue-cron: ${LIBRIS_OVERDUE_CRON:0 30 8 * * *}
  loans:
    loan-days: ${LIBRIS_LOAN_DAYS:14}
    max-active: ${LIBRIS_MAX_ACTIVE_LOANS:3}
    # Window used by the interface to badge a loan as "por vencer".
    due-soon-days: ${LIBRIS_DUE_SOON_DAYS:3}
    reminder-days-before: ${LIBRIS_REMINDER_DAYS_BEFORE:2}
    overdue-limit: ${LIBRIS_OVERDUE_LIMIT:3}
    overdue-window-days: ${LIBRIS_OVERDUE_WINDOW_DAYS:90}
    block-days: ${LIBRIS_BLOCK_DAYS:7}
  open-library:
    base-url: ${OPEN_LIBRARY_BASE_URL:https://openlibrary.org}
    covers-url: ${OPEN_LIBRARY_COVERS_URL:https://covers.openlibrary.org}
    timeout-seconds: ${OPEN_LIBRARY_TIMEOUT_SECONDS:3}
    # Open Library throttles clients that do not identify themselves.
    user-agent: ${OPEN_LIBRARY_USER_AGENT:Libris/1.0 (library loan management technical test)}

---
# Demo profile: loads extra seed data so the dashboards are not empty.
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
